  var NAMES = { colour: "card colour", shield: "Streak shield", frame: { silver: "Silver card frame", gold: "Gold card frame", year: "One-year card frame" },
    pattern: { binakol: "Binakol pattern", triangles: "Triangle pattern", hexagons: "Hexagon pattern", stars: "Star pattern" },
    flame: { blue: "Blue flame", purple: "Purple flame" } };
  var rows = [];
  for (var i = 0; i < 13; i++) {
    var st = AM.road.step(i), words = [], colours = 0;
    st.rewards.forEach(function (r) {
      if (r.kind === "colour") colours++;
      else if (r.kind === "shield") words.push("Streak shield");
      else if (r.kind === "certificate") words.push(r.key === 365 ? "One-year certificate" : "Certificate of practice");
      else words.push(NAMES[r.kind][r.key]);
    });
    if (colours) words.unshift(colours + " new card colours");
    rows.push(el("tr", null, el("td", null, String(st.n)), el("td", null, st.streak + " days"), el("td", null, st.levels ? st.levels + " levels" : "n/a"), el("td", null, words.join(" · "))));
  }
  put(el("table.road-table", null, el("thead", null, el("tr", null, el("th", null, "Step"), el("th", null, "Streak"), el("th", null, "or levels cleared"), el("th", null, "Rewards"))), el("tbody", null, rows)));
  put(el("div.note", { style: { marginTop: "2mm" } }, "Then a streak shield at 600 days and every 100 after. At most two shields are held."));

  var pics = [];
  section("The milestone share picture", "orange, blue and purple flames");
  var picRow = put(el("div.grid.g3"));
  section("The certificate of practice", "earned by a streak, by levels, and the one-year one");
  var certRow = put(el("div.grid.g2"));
  [["orange", 7], ["blue", 100], ["purple", 365]].forEach(function (f) {
    pics.push(AM.share.picture(f[1], "Maya Santos", f[0]).then(function (b) {
      picRow.appendChild(el("div.pic", null, el("img", { src: URL.createObjectURL(b) }), cap(f[1] + " days", f[0] + " flame")));
    }));
  });
  [{ by: "streak", days: 30, levels: 25 }, { by: "levels", days: 30, levels: 25 }, { by: "streak", days: 365, levels: null, year: true }].forEach(function (o) {
    o.name = "Maya Santos"; o.day = today;
    pics.push(AM.share.certificate(o).then(function (b) {
      certRow.appendChild(el("div.pic", null, el("img", { src: URL.createObjectURL(b) }), cap(o.year ? "One year" : o.by === "levels" ? "By levels" : "By a streak")));
    }));
  });

  /* ---------- 5 to 12 · screens ---------- */
  var GROUPS = [
    ["5", "First open and Home", "home"],
    ["6", "Practice, from lesson to level-up", "practice"],
    ["7", "Question types and answers", "types"],
    ["8", "Basics and facts", "basics"],
    ["9", "Streaks, badges and rewards", "rewards"],
    ["10", "Challenge, practice exam and review", "challenge"],
    ["11", "Profile and settings", "profile"],
    ["12", "Dark mode", "dark"]
  ];
  var byGroup = {};
  SHOTS.forEach(function (s) { var p = s.split(":"); (byGroup[p[0]] = byGroup[p[0]] || []).push({ file: p[1], caption: decodeURIComponent(p[2] || "") }); });
  var imgs = [];
  GROUPS.forEach(function (g) {
    var list = byGroup[g[2]] || [];
    if (!list.length) return;
    part(g[0], "Screens: " + g[1], null);
    put(el("div.grid.g4", null, list.map(function (s) {
      var img = el("img", { src: "tools/design-catalog/shots/" + s.file });
      imgs.push(new Promise(function (r) { img.onload = img.onerror = r; }));
      return el("div.shot", null, img, cap(null, s.caption));
    })));
  });

  /* The app may have set the theme or a flame from saved progress on this
     dev server: the catalog shows the defaults, and its own swatches. */
  docEl.dataset.theme = "day";
  docEl.dataset.flame = "orange";
  Promise.all(pics.concat(imgs)).then(function () {
    var wait = Array.prototype.map.call(document.images, function (im) { return im.complete ? null : new Promise(function (r) { im.onload = im.onerror = r; }); });
    return Promise.all(wait);
  }).then(function () { document.title = "READY"; });
}
</script>
</body>
</html>
