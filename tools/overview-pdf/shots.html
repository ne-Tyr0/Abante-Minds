<!DOCTYPE html>
<!-- Screenshot harness for the overview PDF. Not part of the app.

     Seeds a demo learner, drives the real app in an iframe (same origin, so it
     can reach AM directly) and holds it on one screen so headless Chrome can
     photograph it. Used by capture.py:  shots.html?screen=home

     It writes the demo learner over this origin's saved progress. Everything in
     the repo is published to GitHub Pages, so it refuses to run anywhere except
     a local dev server; opened on the live site, it would wipe a real learner. -->
<html>
<head>
<meta charset="utf-8">
<title>Abante Minds screenshot harness</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: system-ui, sans-serif; }
  #frame { width: 390px; height: 844px; border: 0; display: block; }
  #refuse { padding: 24px; max-width: 32em; line-height: 1.5; }
</style>
</head>
<body>
<script>
"use strict";

var LOCAL = /^(?:localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);

if (!LOCAL) {
  document.title = "REFUSED";
  document.body.innerHTML =
    '<p id="refuse">This screenshot harness only runs on a local dev server. ' +
    "It replaces the saved progress on whatever site it is opened on, so it " +
    "has done nothing here.</p>";
} else {
  run();
}

function run() {
  var params = new URLSearchParams(location.search);
  var SCREEN = params.get("screen") || "home";

  /* Dated today. A fixed date goes stale: once it is more than a day old the
     app reads it as a missed day, demotes the learner, and every screenshot
     shows the demotion card instead of the screen asked for. */
  var now = new Date();
  var today = now.getFullYear() + "-" +
    String(now.getMonth() + 1).padStart(2, "0") + "-" +
    String(now.getDate()).padStart(2, "0");

  /* Two decimals levels cleared and the third half done. */
  var LEARNER = {
    version: 2, installed: true, signedIn: true,
    profile: { name: "Ligaya Mendoza", school: "Poblacion, Pilar",
               colorKey: 2, iconKey: "triangle", username: "ligaya.m" },
    levels: {
      "decimals/place-value": { correct: 8, attempts: 9, cleared: true, lessonSeen: true },
      "decimals/compare-and-round": { correct: 8, attempts: 11, cleared: true, lessonSeen: true },
      "decimals/add-and-subtract": { correct: 4, attempts: 6, cleared: false, lessonSeen: true }
    },
    lastLevel: { topic: "decimals", level: "add-and-subtract" },
    streakDays: 4, lastActiveDay: today, lastRolledDay: today,
    week: [true, true, true, true, false, false, false],
    resetToday: false, totalCorrect: 20,
    lastSession: { topicLabel: "Decimals", levelTitle: "Add and subtract", correct: 7, attempted: 10 }
  };

  /* Basics: the 2s mastered, the 5s and 3s part way, so the times-table grid
     shows all three shades. */
  var yesterday = new Date(now.getTime() - 86400000);
  var before = yesterday.getFullYear() + "-" + String(yesterday.getMonth() + 1).padStart(2, "0") + "-" + String(yesterday.getDate()).padStart(2, "0");
  LEARNER.facts = {};
  [2, 3, 4, 5, 6, 7, 8, 9, 10].forEach(function (y) {
    LEARNER.facts["times.x2:2," + y] = { seen: 3, right: 3, miss: 0, days: [before, today], last: today };
  });
  [3, 4, 5, 6].forEach(function (y) {
    LEARNER.facts["times.x5:5," + y] = { seen: 2, right: 2, miss: 0, days: [before, today], last: today };
  });
  [7, 8, 9].forEach(function (y) {
    LEARNER.facts["times.x5:5," + y] = { seen: 1, right: 1, miss: 0, days: [today], last: today };
  });
  [3, 4, 6].forEach(function (y) {
    LEARNER.facts["times.x3:3," + y] = { seen: 1, right: 0, miss: 1, days: [], last: today };
  });
  LEARNER.levels["times/2-5-10"] = { correct: 0, attempts: 0, cleared: false, lessonSeen: true };

  var frame = document.createElement("iframe");
  frame.id = "frame";
  /* 390x844 unless asked otherwise (&w=360&h=640), to check a smaller phone.
     Set on the frame, not from the window: headless Chrome will not make a
     window narrower than about 500px, whatever --window-size says. */
  if (params.get("w")) frame.style.width = Number(params.get("w")) + "px";
  if (params.get("h")) frame.style.height = Number(params.get("h")) + "px";
  frame.src = "../../index.html";
  document.body.appendChild(frame);

  /* Seed before the app reads its state, then reload so it boots with the
     demo learner. */
  frame.addEventListener("load", function once() {
    frame.removeEventListener("load", once);
    try {
      frame.contentWindow.localStorage.setItem("abante-minds/v1", JSON.stringify(LEARNER));
    } catch (e) {
      document.title = "SEED-FAILED";
      return;
    }
    /* The app's first screen waits for the question pack, so drive it only
       once that screen is up; driving it sooner gets overwritten. */
    frame.addEventListener("load", function () {
      var app = frame.contentWindow.AM && frame.contentWindow.AM.app;
      if (!app || !app.ready) { document.title = "NO-APP"; return; }
      app.ready.then(function () { drive(SCREEN); });
    });
    frame.contentWindow.location.reload();
  });

  function drive(screen) {
    var w = frame.contentWindow;
    var AM = w.AM;
    if (!AM) { document.title = "NO-APP"; return; }

    /* One fixed question, 7 − 2.35, shown mid-session in the learner's
       current level so the header reads 3/10 and the feedback fits the
       answer given. */
    function canonicalAt(i) {
      AM.app.startLevel("decimals", "add-and-subtract");
      var s = AM.app.session;
      for (var n = 0; n < i; n++) s.questions[n].__counted = true;
      var q = AM.content.instance("decimals.subtract", 1, { pb: 2, w2: 2, f2: 35, a: 7 }, "difference");
      q.id = "canonical";
      s.questions[i] = q;
      s.index = i;
      s.entry = AM.entry.create(q.entry);
      return s;
    }

    /* Through the keypad's own path, so the field shows what a learner sees.
       ">" stands for the Next key that moves between fraction boxes. */
    function typeIn(text) {
      text.split("").forEach(function (k) { if (k === ">") AM.app.nextBox(); else AM.app.type(k); });
    }

    /* One item of a topic on the practice screen: typed (or picked) and,
       when asked, checked. */
    function dataItem(level, id, params, given, check) { topicItem("data", level, id, params, given, check); }
    function topicItem(topic, level, id, params, given, check) {
      AM.store.markLessonSeen(topic, level);
      AM.app.startLevel(topic, level);
      var ds = AM.app.session;
      ds.questions[0] = AM.content.instance(id, 1, params);
      ds.entry = ds.questions[0].entry ? AM.entry.create(ds.questions[0].entry) : null;
      AM.app.go("practice");
      if (typeof given === "number") { ds.picked = given; AM.app.render(); }
      else if (given) typeIn(given);
      if (check) AM.app.check();
    }

    /* Fraction and per-cent answers, for reviewing the answer field until a
       real topic in the pack uses them. Installed in memory only. */
    function useAnswerFixture() {
      var base = {
        competency: "G6.Q1.11", domain: "NA", construct: "review", schema: "equal-groups",
        hints: ["h", "h", "h"], steps: ["s", "s", "s"], explain: "e",
        distractors: [{ value: "answer + 1", error: "one-more", feedback: "One more." }]
      };
      function t(id, extra) { var o = {}; Object.keys(base).forEach(function (k) { o[k] = base[k]; }); Object.keys(extra).forEach(function (k) { o[k] = extra[k]; }); o.id = id; return o; }
      AM.content.use({
        subtest: "math", version: "0.0.0", fallbackFeedback: "Start from the first step below.",
        formFeedback: {
          "not-lowest-terms": "Right amount, but not in lowest terms. Divide the top and bottom by the same number.",
          "not-a-mixed-number": "Right amount. Now write it as a mixed number: a whole number and a fraction.",
          "fraction-part-not-proper": "The fraction part should be less than 1. Move the whole ones into the whole number."
        },
        topics: [{ key: "review", label: "Answer review", icon: "percent", colorKey: 1, file: "-" }]
      }, [{
        topic: "review",
        levels: [{ id: "all", title: "Answer review", templates: ["review.mixed", "review.percent"] }],
        pinned: [
          { template: "review.mixed", params: { w: 2, a: 3 } },
          { template: "review.percent", params: { a: 7 } }
        ],
        templates: [
          t("review.mixed", {
            params: { w: { range: [1, 3] }, a: { range: [1, 3] } },
            answer: { type: "mixed", value: "w + a / 4" },
            formats: [{ id: "one", prompt: "A recipe needs {w * 4 + a}/4 cups of rice. Write that as a mixed number." }]
          }),
          t("review.percent", {
            params: { a: { range: [2, 9] } },
            answer: { type: "percent", value: "a * 10" },
            formats: [{ id: "one", prompt: "{a} out of 10 learners passed. What per cent passed?" }]
          })
        ]
      }]);
    }

    var s;
    switch (screen) {
      case "splash":
        w.localStorage.clear();
        AM.app.go("splash");
        break;
      case "home":
        AM.app.go("home");
        break;
      case "topics":
        AM.app.go("topics");
        break;
      case "topic":
        AM.app.openTopic("decimals");
        break;
      case "lesson":
        AM.app.openLesson("decimals", "add-and-subtract");
        AM.app.scratch.lesson.page = 1; /* the worked example */
        AM.app.go("lesson");
        break;
      case "practice":
        s = canonicalAt(3); AM.app.go("practice"); typeIn("4.65");
        break;
      case "hint":
        s = canonicalAt(3); s.showHints = true; s.hintsRevealed = 1; AM.app.go("practice");
        break;
      case "correct":
        s = canonicalAt(3); AM.app.go("practice"); typeIn("4.65"); AM.app.check();
        break;
      case "wrong":
        s = canonicalAt(3); AM.app.go("practice"); typeIn("5.35"); AM.app.check();
        break;
      case "levelup":
        AM.app.startLevel("decimals", "add-and-subtract");
        var lv = AM.store.get().levels["decimals/add-and-subtract"];
        lv.correct = 8; lv.cleared = true;
        AM.store.set({ levels: AM.store.get().levels });
        AM.app.go("levelup");
        break;
      case "summary":
        AM.app.startLevel("decimals", "add-and-subtract");
        AM.app.scratch.result = {
          topicKey: "decimals", topicLabel: "Decimals", colorKey: 1,
          levelId: "add-and-subtract", levelTitle: "Add and subtract", levelNumber: 3, redo: false,
          attempted: 10, correct: 7, missed: AM.app.session.questions.slice(0, 3), minutes: 9
        };
        AM.app.session = null;
        AM.app.go("summary");
        break;
      case "profile":
        AM.app.go("profile");
        break;
      case "offline":
        AM.store.setOffline(true);
        AM.app.go("home");
        break;
      /* Not in the PDF: the install offer, for review. The demo learner is
         seeded as installed, so these switch that off first. */
      case "home-install":
        AM.store.set({ installed: false, installCardDismissed: false });
        AM.app.go("home");
        break;
      case "profile-install":
        AM.store.set({ installed: false });
        AM.app.go("profile");
        break;
      case "install-steps":
        AM.store.set({ installed: false });
        AM.app.go("profile");
        AM.app.deferredInstall = null; /* no one-tap prompt, so the offer opens the steps */
        AM.app.offerInstall();
        break;
      /* Not in the PDF: the Basics track, for review. */
      case "basics":
        AM.app.go("basics");
        break;
      case "basics-topic":
        AM.app.openBasicsTopic("times");
        break;
      case "basics-adding":
        AM.app.openBasicsTopic("add-subtract");
        break;
      case "basics-mental":
        AM.app.openBasicsTopic("mental");
        break;
      case "mental-practice":
        AM.store.markLessonSeen("mental", "split");
        AM.app.startLevel("mental", "split");
        s = AM.app.session;
        s.questions[0] = AM.content.instance("mental.split-times", 1, { a: 23, m: 4 }, "price");
        s.entry = AM.entry.create("number");
        AM.app.go("practice");
        typeIn("32"); AM.app.check();
        break;
      case "mental-levelup":
        AM.store.markLessonSeen("mental", "split");
        AM.app.startLevel("mental", "split");
        var ml = AM.store.levelState("mental", "split");
        AM.store.get().levels["mental/split"] = { correct: 8, attempts: 9, cleared: true, lessonSeen: true };
        AM.store.set({ levels: AM.store.get().levels });
        AM.app.go("levelup");
        break;
      case "facts":
      case "facts-correct":
      case "facts-wrong":
        AM.app.startLevel("times", "2-5-10");
        s = AM.app.session;
        for (var k = 0; k < 3; k++) s.questions[k].__counted = true;
        s.questions[3] = AM.content.factQuestion("times", "2-5-10", "times.x5:5,7", 2, 3);
        s.index = 3;
        s.entry = AM.entry.create("number");
        s.shownAt = Date.now() - 1900;
        AM.app.go("practice");
        if (screen === "facts") typeIn("35");
        /* A right fact moves on by itself after a moment; a copy of the
           session keeps this one on screen for the picture. */
        if (screen === "facts-correct") { typeIn("35"); AM.app.check(); AM.app.session = Object.assign({}, AM.app.session); }
        if (screen === "facts-wrong") { typeIn("30"); AM.app.check(); }
        break;
      case "facts-summary":
        AM.app.scratch.result = {
          topicKey: "times", topicLabel: "Times tables", colorKey: 3, levelId: "2-5-10", levelTitle: "2, 5 and 10",
          levelNumber: 1, track: "basics", kind: "facts", facts: true, quick: 15, masteredNow: 4, redo: false,
          attempted: 21, correct: 18, missed: [], minutes: 4
        };
        AM.app.go("summary");
        break;
      /* Not in the PDF: the fraction and per-cent answer fields, for review. */
      case "fraction-entry":
        useAnswerFixture(); AM.app.startLevel("review", "all"); typeIn("2>3");
        break;
      case "fraction-wrong-form":
        useAnswerFixture(); AM.app.startLevel("review", "all"); typeIn(">11>4"); AM.app.check();
        break;
      case "percent-entry":
        useAnswerFixture(); AM.app.startLevel("review", "all"); AM.app.next(); typeIn("70");
        break;
      /* Not in the PDF: the data topic's charts, for review. */
      case "data-lesson":
        AM.app.openLesson("data", "reading"); AM.app.lessonPage(1);
        break;
      case "data-bar":
        dataItem("reading", "data.read-bar", { ctx: 3, a1: 9, a2: 4, a3: 6, a4: 3, b1: 5, b2: 8, b3: 6, b4: 4, sr: 2, m: 2 }, "16");
        break;
      case "data-line":
        dataItem("comparing", "data.line-change", { ctx: 1, a1: 3, a2: 5, a3: 4, a4: 8, a5: 9, b1: 6, b2: 6, b3: 7, b4: 5, b5: 3, sr: 1, m: 3 }, "40", true);
        break;
      case "data-trend":
        dataItem("conclusions", "data.trend", { ctx: 1, tr: 3, u1: 2, u2: 1, u3: 2, u4: 1, b: 3 }, 0, true);
        break;
      case "data-pie":
        dataItem("pie-graphs", "data.pie-missing", { ctx: 1, p1: 25, p2: 15, p3: 10, sl: 4 }, "50");
        break;
      case "data-pie-degrees":
        dataItem("problems", "data.pie-count", { ctx: 2, d1: 72, d2: 54, d3: 108, sl: 2, n: 40 }, "54", true);
        break;
      case "data-table":
        dataItem("problems", "data.table-difference", { u1: 5, v1: 25, u2: 6, v2: 5, u3: 25, v3: 28, u4: 0, v4: 30, w: 2 }, "0.5");
        break;
      /* Not in the PDF: the time topic's clock-time answers, for review. */
      case "time-entry":
        topicItem("time", "24-hour", "time.to-24", { h: 15, m: 45 }, "15");
        break;
      case "time-correct":
        topicItem("time", "start-and-end", "time.end-time", { s: 890, d: 105 }, "1635", true);
        break;
      case "time-wrong":
        topicItem("time", "time-zones", "time.zone-convert", { p: 5, t: 900 }, "1900", true);
        break;
      case "time-choice":
        topicItem("time", "how-long", "time.store-hours", { s: 510, e: 1290 }, 1, true);
        break;
      /* Not in the PDF: the transformations topic's pictures, for review. */
      case "transform-gap":
        topicItem("transform", "angles-at-a-point", "transform.gap-at-a-point", { i: 1 }, "36");
        break;
      case "transform-fill":
        topicItem("transform", "any-shape", "transform.fill-the-gap", { c: 1 }, "4", true);
        break;
      case "transform-clock":
        topicItem("transform", "moves", "transform.clock-turn", { h: 2, q: 90 }, "11", true);
        break;
      case "transform-mirror":
        topicItem("transform", "moves", "transform.mirror-distance", { d: 3, side: "left" }, "6");
        break;
      default:
        document.title = "UNKNOWN-SCREEN";
        return;
    }
    document.title = "READY-" + screen;
  }
}
</script>
</body>
</html>
