<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abante Minds</title>
<meta name="description" content="NCE math practice that works offline.">
<meta name="theme-color" content="#eef3fb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/abante-minds-mark.png">
<link rel="apple-touch-icon" href="assets/abante-minds-mark.png">

<!-- Lexend, the reading and UI face. Both of its subsets are preloaded: ₱ (U+20B1)
     sits in latin-ext, not latin, and it appears in most money questions, so
     without this the peso sign swaps in a beat after the words around it. Baloo 2
     is Reward-mode only and can wait. crossorigin is required on a font preload
     even same-origin, or the file is fetched twice. -->
<link rel="preload" href="assets/fonts/lexend-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/lexend-latin-ext.woff2" as="font" type="font/woff2" crossorigin>

<!-- The design system, imported from the claude.ai design project unchanged.
     Its token files are listed individually instead of via styles.css so that
     tokens/fonts.css — which pulls both faces from Google's CDN — can be
     skipped in favour of app/fonts.css. The _ds/ folder itself is untouched;
     the order below is exactly the order styles.css imports in. -->
<link rel="stylesheet" href="app/fonts.css">
<link rel="stylesheet" href="_ds/abante-minds-design-system-561b7534-fa3f-47b6-9ed0-b8f880eb666b/tokens/colors.css">
<link rel="stylesheet" href="_ds/abante-minds-design-system-561b7534-fa3f-47b6-9ed0-b8f880eb666b/tokens/typography.css">
<link rel="stylesheet" href="_ds/abante-minds-design-system-561b7534-fa3f-47b6-9ed0-b8f880eb666b/tokens/spacing.css">
<link rel="stylesheet" href="_ds/abante-minds-design-system-561b7534-fa3f-47b6-9ed0-b8f880eb666b/tokens/depth.css">
<link rel="stylesheet" href="_ds/abante-minds-design-system-561b7534-fa3f-47b6-9ed0-b8f880eb666b/foundations/press.css">
<link rel="stylesheet" href="motion/motion.css">
<link rel="stylesheet" href="app/app.css">
</head>
<body>
<div id="am-root" class="am-root am-reset" data-device="phone"></div>

<noscript>
  <p style="padding:24px;font-family:system-ui,sans-serif">
    Abante Minds needs JavaScript. Practice is stored on this phone, so nothing is lost once it is switched on.
  </p>
</noscript>

<script src="app/icons.js"></script>
<script src="app/ui.js"></script>
<script src="app/content.js"></script>
<script src="app/store.js"></script>
<script src="app/screens.js"></script>
<script src="motion/motion.js"></script>
<script src="app/app.js"></script>
</body>
</html>
